name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history is required by the retained integration-provenance tests
      # (e.g. tests/postgresql-c2-safe-aggregate.test.mjs), which resolve the
      # recorded tested-head base and the squash-integration commits and diff
      # their trees. Those tests never assert ancestry the squash-only merge
      # policy replaced; they assert the parent link and content equivalence.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The released SQL suites resolve the injected PostgreSQL engine from the repository-owned
      # `.ks-journey-runtime` root or from their declared `/workspace/.ks-journey-runtime`
      # fallback, so the declared fallback parent is created before provisioning.
      - name: Prepare the declared runtime roots
        run: |
          sudo mkdir -p /workspace
          sudo chown "$(id -u):$(id -g)" /workspace
      # Provision and verify the minimal runtime dependency closure from the committed binding
      # (dependencies/ks-journey-runtime/package-lock.json) and the pinned artifact manifest
      # (contracts/dependencies/ks255-journey-runtime-v1.json). KS255_PINNED_SPECIFIER states the
      # specifier this workflow provisions; the provisioner refuses a declaration that disagrees
      # with the pin (WORKFLOW_PIN_DISAGREES_WITH_MANIFEST), and --require-resolved /
      # --require-verified refuse an unresolved or unverified required suite.
      - name: Provision the pinned journey runtime (committed locked closure)
        env:
          KS255_PINNED_SPECIFIER: '@electric-sql/pglite@0.3.14'
        run: |
          node scripts/provision-ks255-journey-runtime.mjs --install
          node scripts/provision-ks255-journey-runtime.mjs --verify
          node scripts/provision-ks255-journey-runtime.mjs --measure --require-resolved --require-verified
      - name: Provision the pinned file runtime (DuckDB 1.5.6-r.1 locked closure)
        run: |
          export TMPDIR="$RUNNER_TEMP"
          node scripts/provision-duckdb-file-runtime.mjs --install
          node scripts/provision-duckdb-file-runtime.mjs --verify
      # K01 requires an actual kernel-enforced namespace; never skip/fallback unisolated.
      - name: Prepare and execute the required aggregate sandbox
        run: |
          if ! test -x /usr/bin/bwrap; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
          # Only these two repository-owned profiles are loaded, on an ephemeral hosted runner.
          # Namespace bootstrap may use its kernel-granted capabilities; every child denies them.
          test "${RUNNER_ENVIRONMENT:?}" = github-hosted
          test "${RUNNER_OS:?}" = Linux
          node --input-type=module -e 'import {readFileSync,existsSync,writeFileSync} from "node:fs"; const keys=["apparmor_restrict_unprivileged_userns","apparmor_restrict_unprivileged_unconfined","unprivileged_userns_clone"]; const state=Object.fromEntries(keys.map(k=>[k,existsSync("/proc/sys/kernel/"+k)?readFileSync("/proc/sys/kernel/"+k,"utf8").trim():null])); writeFileSync(process.env.RUNNER_TEMP+"/ks283-security-before.json",JSON.stringify(state)); console.log("K01 runner policy before:",JSON.stringify(state));'
          sudo apparmor_parser --replace --skip-cache scripts/ci/ks283-bwrap.apparmor
          sudo python3 -c 'from pathlib import Path; rows=set(Path("/sys/kernel/security/apparmor/profiles").read_text().splitlines()); expected={"ks283-ci-bwrap (enforce)","ks283-ci-child (enforce)"}; assert expected <= rows, (expected,rows); print("K01 repository-owned profiles enforced:",sorted(expected))'
          node --input-type=module -e 'import {readFileSync,existsSync} from "node:fs"; import assert from "node:assert/strict"; const keys=["apparmor_restrict_unprivileged_userns","apparmor_restrict_unprivileged_unconfined","unprivileged_userns_clone"]; const after=Object.fromEntries(keys.map(k=>[k,existsSync("/proc/sys/kernel/"+k)?readFileSync("/proc/sys/kernel/"+k,"utf8").trim():null])); assert.deepEqual(after,JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/ks283-security-before.json"))); console.log("K01 runner policy after (unchanged):",JSON.stringify(after));'
          # No fallback, blanket policy/sysctl change, host-network sharing or unisolated execution.
          node --input-type=module -e 'import { aggregateSandboxCommand } from "./services/bi-control/src/business-bi/permitted-aggregate-sandbox.mjs"; import { spawnSync } from "node:child_process"; import { readFileSync } from "node:fs"; const {command:c,args:a}=aggregateSandboxCommand(process.cwd()); const p=spawnSync(c,a,{input:readFileSync("examples/business-bi/k01-permitted-period-aggregates-v1.json"),encoding:"utf8",timeout:5000,maxBuffer:1048576,env:{}}); console.log("K01 runner sandbox status:",p.status,"signal:",p.signal,"error:",p.error?.code??null); process.stdout.write(p.stdout??""); process.stderr.write(p.stderr??""); if(p.status!==0)process.exit(1);'
          node scripts/run-permitted-aggregate-journey.mjs --input examples/business-bi/k01-permitted-period-aggregates-v1.json
          node --input-type=module -e 'import {aggregateSandboxCommand} from "./services/bi-control/src/business-bi/permitted-aggregate-sandbox.mjs"; import {spawnSync} from "node:child_process"; import assert from "node:assert/strict"; const {command,args}=aggregateSandboxCommand(process.cwd()); const code="const f=require(\"node:fs\"); console.log(JSON.stringify({profile:f.readFileSync(\"/proc/self/attr/current\",\"utf8\").trim(),status:f.readFileSync(\"/proc/self/status\",\"utf8\")}))"; const p=spawnSync(command,args.slice(0,-1).concat("--eval",code),{encoding:"utf8",timeout:5000,maxBuffer:1048576,env:{}}); assert.equal(p.status,0,p.stderr); const info=JSON.parse(p.stdout); assert.ok(info.profile.includes("ks283-ci-child")&&info.profile.includes("enforce"),info.profile); const caps=Object.fromEntries(["CapEff","CapPrm","CapAmb"].map(k=>[k,info.status.match(new RegExp("^"+k+":\\s*([0-9a-f]+)$","m"))[1]])); assert.ok(Object.values(caps).every(v=>/^0+$/.test(v)),caps); console.log("K01 actual stacked child:",JSON.stringify({profile:info.profile,caps}));'
      - name: Execute required pinned file profile and executing boundary refusals
        run: |
          export TMPDIR="$RUNNER_TEMP"
          node --test tests/duckdb-file-profile.test.mjs \
                    tests/duckdb-file-security.test.mjs \
                    tests/duckdb-file-runtime.test.mjs \
                    tests/duckdb-file-boundary.test.mjs
      - name: Execute required exact provider identity and scoped HELD/source boundaries
        run: |
          export TMPDIR="$RUNNER_TEMP"
          node --test tests/provider-pair-profile.test.mjs \
                    tests/provider-pair-http.test.mjs \
                    tests/provider-pair-execution.test.mjs
      - name: Execute required invoice-date O2C views and source/rights refusals
        run: |
          export TMPDIR="$RUNNER_TEMP"
          node --test tests/invoice-date-o2c-journey.test.mjs \
                    tests/invoice-date-o2c-negatives.test.mjs \
                    tests/invoice-date-o2c-views.test.mjs \
                    tests/invoice-date-o2c-boundary.test.mjs
      - name: Provision and execute the exact public PAN520 native O2C counterpart
        run: |
          export TMPDIR="$RUNNER_TEMP"
          export GIT_TERMINAL_PROMPT=0
          export KS285_PAN520_SOURCE="$RUNNER_TEMP/ks285-pan520-cf199bbd"
          git init "$KS285_PAN520_SOURCE"
          # Public candidate only; no auth, branch-tip trust, merge/release or CLOSED gate.
          git -C "$KS285_PAN520_SOURCE" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/JoFe2/PANSPHAIRA.git cf199bbd35706bdeadb04679af7354c94caf482a
          git -C "$KS285_PAN520_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$KS285_PAN520_SOURCE" rev-parse HEAD)" = cf199bbd35706bdeadb04679af7354c94caf482a
          test "$(git -C "$KS285_PAN520_SOURCE" rev-parse 'HEAD^{tree}')" = e8e75614ffb8f1d71a6715413386bfd5619e1c3e
          (cd "$KS285_PAN520_SOURCE" && npm ci --ignore-scripts && npm run build)
          # Pair CLI is relative to the KS checkout, never the producer cwd.
          node --test tests/pan520-o2c-pair.test.mjs
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV,"KS285_PAN520_SOURCE="+process.env.KS285_PAN520_SOURCE+"\n");'
      - name: Execute required actual native P2P procurement and independent question refusals
        run: |
          export TMPDIR="$RUNNER_TEMP"
          export KS286_PAN520_SOURCE="$KS285_PAN520_SOURCE"
          # Reuse the exact public Git/build closure above, never a provider stub or CLOSED gate.
          node --test tests/procurement-analysis-journey.test.mjs \
                    tests/procurement-analysis-negatives.test.mjs \
                    tests/procurement-analysis-views.test.mjs \
                    tests/procurement-analysis-boundary.test.mjs \
                    tests/pan520-p2p-pair.test.mjs
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV,"KS286_PAN520_SOURCE="+process.env.KS286_PAN520_SOURCE+"\n");'
      - name: Execute required stock provenance and bounded deadline product
        run: |
          export TMPDIR="$RUNNER_TEMP"
          test -d "${KS285_PAN520_SOURCE:?}"
          # Existing exact native source and separately declared synthetic forecast, never a stub.
          node --test --test-concurrency=1 tests/pan520-stock-pair.test.mjs \
                    tests/stock-deadline-product.test.mjs \
                    tests/stock-deadline-negatives.test.mjs \
                    tests/stock-source-boundary.test.mjs \
                    tests/stock-historical-profile.test.mjs \
                    tests/stock-runtime-ci-binding.test.mjs
      - name: Provision and execute the exact public PAN526 shared runtime contract
        run: |
          export TMPDIR="$RUNNER_TEMP"
          export GIT_TERMINAL_PROMPT=0
          export KS292_PAN526_SOURCE="$RUNNER_TEMP/ks292-pan526-700c7ca3"
          git init "$KS292_PAN526_SOURCE"
          # One exact public implementation; no duplicate schema, auth or CLOSED gate.
          git -C "$KS292_PAN526_SOURCE" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/JoFe2/PANSPHAIRA.git 700c7ca369e2ac7aca4973480b4e265bfcffb454
          git -C "$KS292_PAN526_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$KS292_PAN526_SOURCE" rev-parse HEAD)" = 700c7ca369e2ac7aca4973480b4e265bfcffb454
          test "$(git -C "$KS292_PAN526_SOURCE" rev-parse 'HEAD^{tree}')" = 05f95b1ac76444a588c9a00b0e326f798d65221a
          (cd "$KS292_PAN526_SOURCE" && npm ci --ignore-scripts && npm run build)
          # Loader qualifies the complete committed source/dependency closure at use.
          node --test tests/h01-local-stack-facts.test.mjs \
                    tests/h01-pan-runtime-source.test.mjs \
                    tests/h01-local-runtime-context.test.mjs
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV,"KS292_PAN526_SOURCE="+process.env.KS292_PAN526_SOURCE+"\n");'
      - name: Provision and execute the exact public PAN527 origin and protected-session contract
        run: |
          export TMPDIR="$RUNNER_TEMP"
          export GIT_TERMINAL_PROMPT=0
          export KS293_PAN527_SOURCE="$RUNNER_TEMP/ks293-pan527-8ed58034"
          export KS293_PAN527_SESSION_SOURCE="$RUNNER_TEMP/ks293-pan527-6a7752be"
          git init "$KS293_PAN527_SOURCE"
          git -C "$KS293_PAN527_SOURCE" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/JoFe2/PANSPHAIRA.git 8ed580342b1b7392ff3c56175d507084cdbaa8ad
          git -C "$KS293_PAN527_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$KS293_PAN527_SOURCE" rev-parse HEAD)" = 8ed580342b1b7392ff3c56175d507084cdbaa8ad
          test "$(git -C "$KS293_PAN527_SOURCE" rev-parse 'HEAD^{tree}')" = 83c8f0f439969736624a5bd6f0d165fc9dc4f6b6
          (cd "$KS293_PAN527_SOURCE" && npm ci --ignore-scripts && npm run build)
          git init "$KS293_PAN527_SESSION_SOURCE"
          git -C "$KS293_PAN527_SESSION_SOURCE" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/JoFe2/PANSPHAIRA.git 6a7752be07405bd03ccbc40c13a9936d1b8d0d2b
          git -C "$KS293_PAN527_SESSION_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$KS293_PAN527_SESSION_SOURCE" rev-parse HEAD)" = 6a7752be07405bd03ccbc40c13a9936d1b8d0d2b
          test "$(git -C "$KS293_PAN527_SESSION_SOURCE" rev-parse 'HEAD^{tree}')" = 43f33d0c3c14aacc23f1497aae7a0f83f1cd7f30
          (cd "$KS293_PAN527_SESSION_SOURCE" && npm ci --ignore-scripts && npm run build)
          # Origin-only v1 remains a negative predecessor, never promoted.
          # The exact v3 loader and controlled TLS protocol must execute, not skip.
          node --test tests/h02-pan-origin-source.test.mjs \
                    tests/h02-pan-session-source.test.mjs \
                    tests/h02-protected-source-availability.test.mjs \
                    tests/h02-native-protected-ingress.test.mjs \
                    tests/h02-https-network-boundary.test.mjs
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV,"KS293_PAN527_SOURCE="+process.env.KS293_PAN527_SOURCE+"\nKS293_PAN527_SESSION_SOURCE="+process.env.KS293_PAN527_SESSION_SOURCE+"\n");'
      - name: Provision and execute the exact public PAN529 template and native budget contract
        run: |
          export TMPDIR="$RUNNER_TEMP"
          export GIT_TERMINAL_PROMPT=0
          export KS_H05_PAN_SOURCE_ROOT="$RUNNER_TEMP/ks295-pan529-6be21295"
          git init "$KS_H05_PAN_SOURCE_ROOT"
          # Exact public development contract only, not a source, execution or release grant.
          git -C "$KS_H05_PAN_SOURCE_ROOT" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/JoFe2/PANSPHAIRA.git 6be212953b2cb52f46347e10132d13b95f881f29
          git -C "$KS_H05_PAN_SOURCE_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$KS_H05_PAN_SOURCE_ROOT" rev-parse HEAD)" = 6be212953b2cb52f46347e10132d13b95f881f29
          test "$(git -C "$KS_H05_PAN_SOURCE_ROOT" rev-parse 'HEAD^{tree}')" = 3b8d7b6b5f29fe4b0736a00d3db5dd380bfefcef
          (cd "$KS_H05_PAN_SOURCE_ROOT" && npm ci --ignore-scripts && npm run build)
          # Persist only the owned checkout's ordinary stat cache before read-only use-time guards.
          git -C "$KS_H05_PAN_SOURCE_ROOT" update-index --refresh
          test "$(git -C "$KS_H05_PAN_SOURCE_ROOT" write-tree)" = 3b8d7b6b5f29fe4b0736a00d3db5dd380bfefcef
          # Native consumer-owned SQLite, actual authenticated HTTP, race/restart and template paths.
          # Serialize CPU-heavy suite processes, not the 100 actual reservations inside each test.
          node --test --test-concurrency=1 tests/h05-closed-runtime-template.test.mjs \
                    tests/h05-native-broker-runtime.test.mjs \
                    tests/h05-native-control-route.test.mjs \
                    tests/h05-native-model-idempotency.test.mjs \
                    tests/h05-native-model-retry-custody.test.mjs \
                    tests/h05-native-model-unknown-restart.test.mjs \
                    tests/h05-native-openai-consumer.test.mjs \
                    tests/h05-native-resource-store.test.mjs \
                    tests/h05-runtime-ci-binding.test.mjs \
                    tests/h05-shared-runtime-source.test.mjs \
                    tests/h05-template-native-product-route.test.mjs
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV,"KS_H05_PAN_SOURCE_ROOT="+process.env.KS_H05_PAN_SOURCE_ROOT+"\n");'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Provision and execute the pinned relational Core MariaDB worker
        run: |
          export TMPDIR="$RUNNER_TEMP"
          python scripts/provision-relational-core-runtime.py --install
          python scripts/provision-relational-core-runtime.py --verify
          export KS288_RELATIONAL_PYTHON="$PWD/.ks-relational-core-runtime/venv/bin/python"
          export KS288_FIXTURE_ROOT="$RUNNER_TEMP/ks288-owned-native-fixture"
          "$KS288_RELATIONAL_PYTHON" -I -B scripts/prepare-relational-core-native-fixture.py --start --root "$KS288_FIXTURE_ROOT"
          export KS288_NATIVE_TEST_CONFIG="$KS288_FIXTURE_ROOT/config.json"
          export KS288_TEST_OWNER="$("$KS288_RELATIONAL_PYTHON" -I -B -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["KS288_FIXTURE_ROOT"])/"owned-state.json").read_text())["nonce"])')"
          node --test --test-concurrency=1 tests/relational-core-product.test.mjs tests/relational-core-runtime-ci-binding.test.mjs
          # Keep the exact owned fixture for mandatory canonical execution; no skip/fallback.
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; const keys=["KS288_RELATIONAL_PYTHON","KS288_FIXTURE_ROOT","KS288_NATIVE_TEST_CONFIG","KS288_TEST_OWNER"]; appendFileSync(process.env.GITHUB_ENV,keys.map(k=>k+"="+process.env[k]+"\n").join(""));'
      - name: Execute required bounded local HTTP read and explicit real-target boundary
        run: |
          export TMPDIR="$RUNNER_TEMP"
          node --test --test-concurrency=1 tests/bounded-api-read-product.test.mjs tests/bounded-api-read-ci-binding.test.mjs
      - name: Prepare required exact PAN549 and unchanged K05 browser composition
        run: |
          export TMPDIR="$RUNNER_TEMP"
          # Own extraction only: no host package installation, global trust or auth writes.
          export KS303_NSS_ROOT="$RUNNER_TEMP/ks303-owned-nss-tools"
          mkdir "$KS303_NSS_ROOT"
          (cd "$KS303_NSS_ROOT" && apt-get download libnss3-tools)
          for package in "$KS303_NSS_ROOT"/*.deb; do
            dpkg-deb --extract "$package" "$KS303_NSS_ROOT/extracted"
          done
          node scripts/provision-ks303-pan549-workspace.mjs --prepare \
            --root "$RUNNER_TEMP/ks303-exact-owned-workspace" \
            --k05-source "${KS285_PAN520_SOURCE:?}" \
            --certutil "$KS303_NSS_ROOT/extracted/usr/bin/certutil" \
            --output "$RUNNER_TEMP/ks303-exact-workspace-provision.json"
          # Both actual composition and integrity-retirement suites run once in npm test.
          # Missing inputs fail, not skip. Do not export HOME/PATH or auth configuration.
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/ks303-exact-workspace-provision.json")); const env=Object.entries(p.productEnv).filter(([k])=>k.startsWith("KS303_")||k==="PLAYWRIGHT_BROWSERS_PATH"); appendFileSync(process.env.GITHUB_ENV,env.map(([k,v])=>k+"="+v+"\n").join(""));'
      - run: npm run dist:agent-skill
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Preserve actual exact-head KS303 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ks303-exact-head-product-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/ks303-exact-workspace-provision.json
            ${{ runner.temp }}/ks303-exact-owned-workspace/product-evidence/*.json
            ${{ runner.temp }}/ks303-exact-owned-workspace/product-evidence/*.png
      # Every suite whose real-SQL legs require the pinned closure is executed explicitly over
      # the provisioned roots, including net-revenue-journey and net-revenue-ledger-mapping,
      # which read only the declared `/workspace/.ks-journey-runtime` fallback.
      - name: Execute every required SQL suite over the pinned closure
        run: |
          node --test tests/net-revenue-connected-journey.test.mjs \
                    tests/net-revenue-f4-composition.test.mjs \
                    tests/net-revenue-guided-journey.test.mjs \
                    tests/net-revenue-journey.test.mjs \
                    tests/net-revenue-ledger-mapping.test.mjs \
                    tests/result-lineage-readonly.test.mjs
      - name: Execute the connected SQL path and the exact CLI negative
        run: |
          export PGLITE_CORE_PATH="$PWD/.ks-journey-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/run-connected-net-revenue-journey.mjs --pglite "$PGLITE_CORE_PATH" --negative > "$RUNNER_TEMP/ks-connected-real-cli.json"
      - name: Score the exact public paired task under requested access modes
        run: |
          git init "$RUNNER_TEMP/ks248-pan"
          git -C "$RUNNER_TEMP/ks248-pan" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/JoFe2/PANSPHAIRA.git d8e78430e66a6d1b623fde26a3018089652d2112
          git -C "$RUNNER_TEMP/ks248-pan" checkout --detach FETCH_HEAD
          export KS247_PRODUCER_CHECKOUT="$RUNNER_TEMP/ks248-pan"
          export KS247_PGLITE_PATH="$PWD/.ks-journey-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node --test tests/ks248-paired-blind-evaluator.test.mjs
          node scripts/run-ks248-paired-access-evaluation.mjs --producer-checkout "$KS247_PRODUCER_CHECKOUT" --pglite "$KS247_PGLITE_PATH" > "$RUNNER_TEMP/ks248-paired-evaluation.json"
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example --file compose.yaml config --quiet
      - name: Read back exact owned relational fixture cleanup
        if: always()
        run: |
          if test -n "${KS288_FIXTURE_ROOT:-}" && test -f "$KS288_FIXTURE_ROOT/owned-state.json"; then
            "$KS288_RELATIONAL_PYTHON" -I -B scripts/prepare-relational-core-native-fixture.py --cleanup --root "$KS288_FIXTURE_ROOT"
          elif test -f "$RUNNER_TEMP/ks288-owned-native-fixture/owned-state.json"; then
            "$PWD/.ks-relational-core-runtime/venv/bin/python" -I -B scripts/prepare-relational-core-native-fixture.py --cleanup --root "$RUNNER_TEMP/ks288-owned-native-fixture"
          fi
