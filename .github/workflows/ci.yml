name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history is required by the retained integration-provenance tests
      # (e.g. tests/postgresql-c2-safe-aggregate.test.mjs), which resolve the
      # recorded tested-head base and the squash-integration commits and diff
      # their trees. Those tests never assert ancestry the squash-only merge
      # policy replaced; they assert the parent link and content equivalence.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The released SQL suites resolve the injected PostgreSQL engine from the repository-owned
      # `.ks-journey-runtime` root or from their declared `/workspace/.ks-journey-runtime`
      # fallback, so the declared fallback parent is created before provisioning.
      - name: Prepare the declared runtime roots
        run: |
          sudo mkdir -p /workspace
          sudo chown "$(id -u):$(id -g)" /workspace
      # Provision and verify the minimal runtime dependency closure from the committed binding
      # (dependencies/ks-journey-runtime/package-lock.json) and the pinned artifact manifest
      # (contracts/dependencies/ks255-journey-runtime-v1.json). KS255_PINNED_SPECIFIER states the
      # specifier this workflow provisions; the provisioner refuses a declaration that disagrees
      # with the pin (WORKFLOW_PIN_DISAGREES_WITH_MANIFEST), and --require-resolved /
      # --require-verified refuse an unresolved or unverified required suite.
      - name: Provision the pinned journey runtime (committed locked closure)
        env:
          KS255_PINNED_SPECIFIER: '@electric-sql/pglite@0.3.14'
        run: |
          node scripts/provision-ks255-journey-runtime.mjs --install
          node scripts/provision-ks255-journey-runtime.mjs --verify
          node scripts/provision-ks255-journey-runtime.mjs --measure --require-resolved --require-verified
      # K01 requires an actual kernel-enforced namespace; never skip/fallback unisolated.
      - name: Prepare and execute the required aggregate sandbox
        run: |
          if ! test -x /usr/bin/bwrap; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
          node scripts/run-permitted-aggregate-journey.mjs --input examples/business-bi/k01-permitted-period-aggregates-v1.json
      - run: npm run dist:agent-skill
      - run: npm test
      # Every suite whose real-SQL legs require the pinned closure is executed explicitly over
      # the provisioned roots, including net-revenue-journey and net-revenue-ledger-mapping,
      # which read only the declared `/workspace/.ks-journey-runtime` fallback.
      - name: Execute every required SQL suite over the pinned closure
        run: |
          node --test tests/net-revenue-connected-journey.test.mjs \
                    tests/net-revenue-f4-composition.test.mjs \
                    tests/net-revenue-guided-journey.test.mjs \
                    tests/net-revenue-journey.test.mjs \
                    tests/net-revenue-ledger-mapping.test.mjs \
                    tests/result-lineage-readonly.test.mjs
      - name: Execute the connected SQL path and the exact CLI negative
        run: |
          export PGLITE_CORE_PATH="$PWD/.ks-journey-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/run-connected-net-revenue-journey.mjs --pglite "$PGLITE_CORE_PATH" --negative > "$RUNNER_TEMP/ks-connected-real-cli.json"
      - name: Score the exact public paired task under requested access modes
        run: |
          git init "$RUNNER_TEMP/ks248-pan"
          git -C "$RUNNER_TEMP/ks248-pan" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/JoFe2/PANSPHAIRA.git d8e78430e66a6d1b623fde26a3018089652d2112
          git -C "$RUNNER_TEMP/ks248-pan" checkout --detach FETCH_HEAD
          export KS247_PRODUCER_CHECKOUT="$RUNNER_TEMP/ks248-pan"
          export KS247_PGLITE_PATH="$PWD/.ks-journey-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node --test tests/ks248-paired-blind-evaluator.test.mjs
          node scripts/run-ks248-paired-access-evaluation.mjs --producer-checkout "$KS247_PRODUCER_CHECKOUT" --pglite "$KS247_PGLITE_PATH" > "$RUNNER_TEMP/ks248-paired-evaluation.json"
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example --file compose.yaml config --quiet
