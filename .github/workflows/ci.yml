name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history is required by the retained integration-provenance tests
      # (e.g. tests/postgresql-c2-safe-aggregate.test.mjs), which resolve the
      # recorded tested-head base and the squash-integration commits and diff
      # their trees. Those tests never assert ancestry the squash-only merge
      # policy replaced; they assert the parent link and content equivalence.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run dist:agent-skill
      - run: npm test
      - name: Provision pinned embedded PostgreSQL for connected journey
        run: npm install --prefix "$RUNNER_TEMP/ks-connected-runtime" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Execute connected SQL paths and exact CLI negative
        run: |
          export PGLITE_CORE_PATH="$RUNNER_TEMP/ks-connected-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node --test tests/net-revenue-connected-journey.test.mjs tests/net-revenue-guided-journey.test.mjs
          node scripts/run-connected-net-revenue-journey.mjs --pglite "$PGLITE_CORE_PATH" --negative > "$RUNNER_TEMP/ks-connected-real-cli.json"
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example --file compose.yaml config --quiet
